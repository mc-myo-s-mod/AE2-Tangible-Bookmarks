modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''
[[mixins]]
config = "${mod_id}.mixins.json"
[[dependencies."${mod_id}"]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"


[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "ae2"
type = "REQUIRED"
ordering="AFTER"
side="BOTH"
versionRange = "[19.2.17,)"

[[dependencies."${mod_id}"]]
modId = "myotus"
type = "REQUIRED"
ordering="AFTER"
side="BOTH"
versionRange = "[${Myotus_version},)"

[[dependencies."${mod_id}"]]
modId = "jei"
type = "OPTIONAL"
ordering="AFTER"
side="CLIENT"
versionRange = "${JEI_version_range}"
